<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LINE × Foundry · Architecture</title>
  <style>
    body { margin: 0; background: #f0f5fa; color: #17324d; font: 16px/1.6 system-ui, sans-serif; }
    main { max-width: 1440px; margin: 32px auto; padding: 0 24px; }
    header { border-left: 5px solid #06a66b; padding: 0 24px; margin-bottom: 24px; }
    h1 { margin: 4px 0; font-size: clamp(24px, 3vw, 38px); letter-spacing: -.03em; }
    .eyebrow { color: #087a56; font-weight: 700; letter-spacing: .12em; font-size: 12px; }
    .legend { display: flex; gap: 20px; flex-wrap: wrap; font-size: 14px; }
    .card { background: white; border: 1px solid #d9e4ef; border-radius: 16px; padding: 24px; box-shadow: 0 12px 40px #17324d0a; overflow-x: auto; }
    #diagram svg { display: block; margin: auto; width: 100%; height: auto; }
    .toolbar { display: flex; gap: 10px; margin: 14px 0; }
    footer { margin: 20px 0; font-size: 13px; }
    a { color: #0369a1; }
    #error { color: #b91c1c; white-space: pre-wrap; }
    button { border: 1px solid #bfd1df; border-radius: 8px; background: white; padding: 8px 14px; cursor: pointer; }
    @media print { body { background: white; } main { margin: 0; } button { display: none; } .card { box-shadow: none; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">LANGUAGE LEARNING · SYSTEM MAP</div>
      <h1>LINE × Foundry イタリア語学習</h1>
      <p>ミニアプリ・LINE Bot と Azure サービスの構成</p>
      <div class="legend"><span>実線・破線：サービス間の接続</span><span>任意のサービスは別途構成が必要です</span></div>
      <div class="toolbar"><button id="fit">全体を表示</button><button id="zoom">拡大して表示</button></div>
    </header>
    <section class="card" aria-label="全体構成図">
      <div id="diagram" aria-live="polite">構成図を読み込み中…</div>
      <div id="error" role="alert"></div>
    </section>
    <footer>
      <button id="download" disabled>SVG を保存</button>
      <a href="./overview.mmd">Mermaid ソース</a> ·
      Icons: <a href="https://msicons.com/">MS Icons</a> /
      <a href="https://learn.microsoft.com/en-us/azure/architecture/icons/">Microsoft terms</a>.
      アイコンは製品の構成説明にのみ使用しています。
    </footer>
  </main>
  <script type="module">
    try {
      const { default: mermaid } = await import('https://cdn.jsdelivr.net/npm/mermaid@11.12.0/dist/mermaid.esm.min.mjs');
      mermaid.initialize({
        startOnLoad: false, securityLevel: 'strict', theme: 'base',
        themeVariables: { primaryColor: '#eff6ff', secondaryColor: '#ffffff', tertiaryColor: '#ffffff', primaryTextColor: '#17324d', primaryBorderColor: '#94b8d4', lineColor: '#52748f', clusterBkg: '#f8fbfd', clusterBorder: '#cbdbe8', fontFamily: 'system-ui, sans-serif', fontSize: '15px' },
        flowchart: { htmlLabels: false, curve: 'basis', nodeSpacing: 32, rankSpacing: 52 },
      });
      const response = await fetch('./overview.mmd');
      if (!response.ok) throw new Error(`Mermaid source: HTTP ${response.status}`);
      const { svg } = await mermaid.render('learning-architecture', await response.text());
      document.querySelector('#diagram').innerHTML = svg;
      document.querySelector('#fit').addEventListener('click', () => { document.querySelector('#diagram').style.width = '100%'; });
      document.querySelector('#zoom').addEventListener('click', () => { document.querySelector('#diagram').style.width = '1600px'; });
      const button = document.querySelector('#download');
      button.disabled = false;
      button.addEventListener('click', async () => {
        try {
          const copy = document.querySelector('#diagram svg').cloneNode(true);
          for (const image of copy.querySelectorAll('image')) {
            const url = image.getAttribute('href') || image.getAttribute('xlink:href');
            const asset = await fetch(url);
            if (!asset.ok) throw new Error(`Icon: HTTP ${asset.status}`);
            const text = await asset.text();
            image.removeAttribute('xlink:href');
            image.setAttribute('href', `data:image/svg+xml;base64,${btoa(Array.from(new TextEncoder().encode(text), byte => String.fromCharCode(byte)).join(''))}`);
          }
          const url = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(copy)], { type: 'image/svg+xml' }));
          const link = document.createElement('a'); link.href = url; link.download = 'line-language-learn-architecture.svg'; link.click();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        } catch (error) { document.querySelector('#error').textContent = `SVG 保存失敗: ${error.message}`; }
      });
    } catch (error) {
      document.querySelector('#diagram').textContent = '';
      document.querySelector('#error').textContent = `構成図の描画に失敗しました: ${error.message}`;
    }
  </script>
</body>
</html>
